async function rpc(name,params={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(params)
  });
  if(!res.ok) throw new Error(`rpc ${name}: ${res.status} ${await res.text()}`);
  return res.json();
}

// ===== MODELS =====
async function loadModels(){
  chartContainer.textContent=t[langSelect.value].chartContainer;
  let models;
  try{
    const rows=await rpc("get_models",{p_mode:MODE});
    models=rows.map(r=>({name:r.device_name,count:r.runs}));
  }catch(e){
    console.error("[loadModels]",e);
    chartContainer.textContent=t[langSelect.value].noData;
    return;
  }

  const sortVal=sortGroup.querySelector("input:checked").value;
  if(sortVal==="name") models.sort((a,b)=>a.name.localeCompare(b.name));
  if(sortVal==="countDesc") models.sort((a,b)=>b.count-a.count);
  if(sortVal==="countAsc") models.sort((a,b)=>a.count-b.count);

  modelContainer.innerHTML="";
  models.forEach(({name,count})=>{
    const lbl=document.createElement("label");
    const chk=document.createElement("input");
    chk.type="checkbox"; chk.value=name;
    lbl.appendChild(chk);
    const wrap=document.createElement("div");
    const span=document.createElement("span");
    span.textContent=name;
    const small=document.createElement("small");
	small.dataset.count = count; // сохраняем число тестов отдельно
    small.textContent=`(${t[langSelect.value].testCount}: ${count})`;
    wrap.appendChild(span);
    wrap.appendChild(small);
    lbl.appendChild(wrap);
    modelContainer.appendChild(lbl);
  });

  // сохранённый выбор читаем заново: при смене сортировки он уже обновлён в savePrefs
  const savedModels=JSON.parse(localStorage.getItem("models") || "[]");
  const boxes=modelContainer.querySelectorAll("input[type=checkbox]");
  boxes.forEach(b=>{if(savedModels.includes(b.value)) b.checked=true;});
  if(boxes.length && !modelContainer.querySelector("input:checked")){
    boxes[0].checked=true;
    boxes.forEach(b=>{if(b.value==="Balance 2") b.checked=true;});
  }

  refreshChart();
  updateTotalTests();
}

function updateTotalTests() {
  let total = 0;
  const smalls = modelContainer.querySelectorAll("small");
  smalls.forEach(small => {
    total += parseInt(small.dataset.count) || 0;
  });
  const tr = t[langSelect.value];
  document.getElementById("modelsCount").textContent = smalls.length ? `(${smalls.length})` : "";
  let text = tr.totalTests + total;
  if (recentRuns !== null) text += " • " + tr.recentTests + recentRuns;
  document.getElementById("totalTests").textContent = text;
}

async function loadRecentRuns(){
  try{
    recentRuns=await rpc("get_recent_runs",{p_days:RECENT_DAYS,p_mode:MODE});
  }catch(e){
    console.error("[loadRecentRuns]",e); // без этого числа остальная статистика работает как раньше
  }
  updateTotalTests();
}

function getSelectedModels(){
  return Array.from(modelContainer.querySelectorAll("input:checked")).map(c=>c.value).slice(0,6);
}

// Статистика всех моделей одним запросом, в старом формате:
// { [device]: { canvas:{min,max,avg,median}, ..., count } }
function loadAllStats(){
  if(!statsPromise){
    statsPromise=rpc("get_device_stats",{p_mode:MODE}).then(rows=>{
      const stats={};
      rows.forEach(r=>{
        const s=stats[r.device_name]||(stats[r.device_name]={count:0});
        s[r.test]={min:r.min_value,max:r.max_value,avg:r.avg_value,median:r.median};
        s.count=Math.max(s.count,r.runs);
      });
      return stats;
    }).catch(e=>{statsPromise=null; throw e;}); // при ошибке повторим запрос в следующий раз
  }
  return statsPromise;
}

async function fetchModelStats(model){
  const stats=await loadAllStats();
  return stats[model]||null;
}

// ===== CHART =====
async function refreshChart(){
  const models=getSelectedModels();
  if(models.length<2){
	chartContainer.textContent=t[langSelect.value].selectModels;
	return;
  }
  chartContainer.textContent=t[langSelect.value].chartContainer;

  const metric=metricGroup.querySelector("input:checked").value;
  const keys=["canvas","canvasText","widget","widget2","math","ls","es","esBf"];
  const labels=labelTranslations[langSelect.value]||labelTranslations.en;

  const lightColors=["#1565c0","#ad1457","#ef6c00","#2e7d32","#c2185b","#6a1b9a","#0277bd","#d84315"];
  const darkColors=["#42a5f5","#f06292","#ffb74d","#81c784","#f48fb1","#ba68c8","#64b5f6","#ff8a65"];
  const colors=document.body.classList.contains("light")?lightColors:darkColors;

  const dataByModel={};
  try{
    for(const model of models){
      const stats=await fetchModelStats(model);
      if(!stats) continue;
      dataByModel[model]=keys.map(k=>stats[k]?stats[k][metric]:0);
    }
  }catch(e){
    console.error("[refreshChart]",e);
    chartContainer.textContent=t[langSelect.value].noData;
    return;
  }

  const modelNames=Object.keys(dataByModel);
  if(!modelNames.length){
	chartContainer.textContent=t[langSelect.value].noData;
	return;
  }

  const maxPerKey=keys.map((_,i)=>Math.max(...modelNames.map(m=>dataByModel[m][i]||0)));
  const normalizedByModel={};
  modelNames.forEach(m=>{
    normalizedByModel[m]=dataByModel[m].map((v,i)=>maxPerKey[i]?v/maxPerKey[i]*100:0);
  });

  const datasets=modelNames.map((m,i)=>({
    label:m,
    data:normalizedByModel[m],
    backgroundColor:colors[i%colors.length],
    //barThickness:18
	//barThickness:"flex"
  }));

  //const groupFactor=Math.max(0.8,1-models.length*0.08);
  //console.log("groupFactor: ", groupFactor);

    const numKeys = 8; // число категорий/ключей
    const barHeight = 8; // высота каждой полосы в px
    const gapBetweenModels = 6; // расстояние между наборами полос

    const totalHeight = numKeys * models.length * (barHeight + gapBetweenModels);

    // Обновляем контейнер и canvas
    chartContainer.innerHTML = '<canvas id="chart"></canvas>';
    const canvas = document.getElementById("chart");
    canvas.height = totalHeight; // задаём динамическую высоту
    const ctx = canvas.getContext("2d");

  //chartContainer.innerHTML='<canvas id="chart"></canvas>';
  //const ctx=document.getElementById("chart").getContext("2d");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
	  type:"bar",
	  data:{labels:labels,datasets:datasets},
	  options:{
		indexAxis:"y",
		responsive:true,
		plugins:{
		  legend:{position:"bottom"},
		  tooltip:{
			callbacks:{
			  label:(ctx)=>{
				const v=ctx.raw;
				return v.toFixed(1)+"%";
			  }
			}
		  },
		  datalabels:{
			  anchor:"end",       // текст справа от полосы
			  align:"right",      // справа от полосы
			  color:document.body.classList.contains("light")?"#000":"#fff",
			  formatter:(v, ctx)=>{
				// Берем оригинальное значение из dataByModel, не нормализованное
				const model = ctx.dataset.label;
				const index = ctx.dataIndex;
				const key = keys[index];
				const originalValue = dataByModel[model][index] || 0;
				return originalValue;
			  }
			}
		},
		scales:{
		  x:{
			beginAtZero:true,
			max:110, // оставляем место для подписей
			ticks:{display:false}
		  },
		  y:{
			//categoryPercentage: 0.2, // ширина группы
			//barPercentage: 0.2,       // ширина каждой полосы
			ticks:{
			  callback:function(value,index){
				const label=this.getLabelForValue(value);
				// Разбиваем длинные подписи на строки через пробелы
				const maxLineLength = 20; // символов на строку
				if(label.length > maxLineLength){
				  let result = [];
				  let words = label.split(" ");
				  let line = "";
				  for(const w of words){
					if((line+w).length > maxLineLength){
					  result.push(line.trim());
					  line = w + " ";
					} else {
					  line += w + " ";
					}
				  }
				  result.push(line.trim());
				  return result; // массив = несколько строк
				}
				return label;
			  }
			}
		  }
		}
	  },
	  plugins:[ChartDataLabels]
	});

}
